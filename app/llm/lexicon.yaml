  - 'research/texas-pi-notes.md (Texas law: Haygood, §18.001, K&L Auto Crushers)'
  - 'research/chronology-practice.md (cited as CP src N)'
  - 'reviews/T-009-legal-nurse.md and reviews/T-009-claims-adjuster.md (round-2 probe-driven additions; the probe sets are artifacts/review-evidence/T-009-nurse-probes.txt and T-009-adjuster-probes.py)'
  - 'memory/ORCHESTRATOR_DECISIONS.md D-003, D-005, D-013, D-017, D-018; memory/DECISIONS.md ADR-008, ADR-010, ADR-011, ADR-013, ADR-014'
  - 'Chapman WW et al., "A simple algorithm for identifying negated findings and diseases in discharge summaries," J Biomed Inform 34:301–310 (2001). NegEx: phrase-list negation with a word window. https://www.bohrium.com/paper-details/a-simple-algorithm-for-identifying-negated-findings-and-diseases-in-discharge-summaries/812456728187633665-10652 (via search index)'
  - 'Chapman BE et al., "Document-level classification of CT pulmonary angiography reports based on an extension of the ConText algorithm," J Biomed Inform (2011). pyConText builds on the NegEx lists; "but"/"although" terminate negation scope. https://pmc.ncbi.nlm.nih.gov/articles/PMC3164892'
  - 'FindLaw, "The Use of Waddell in Workers'' Compensation Claims". Defense and adjuster use of Waddell signs as evidence of non-credibility; the signs were not designed to diagnose malingering. https://corporate.findlaw.com/litigation-disputes/the-use-of-waddell-in-workers-compensation-claims.html'
